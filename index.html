<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Jumper — Boring Teacher</title>
<script>if(new URLSearchParams(location.search).get("autoplay")==="1"&&location.hash.startsWith("#set="))document.documentElement.classList.add("bt-autoplay-pending");</script>
<style>
body{margin:0;background:#10192e;color:#f8f8ff;font-family:"Courier New",monospace}
#jumperFrame{display:none;width:100%;height:calc(100dvh - 12px);min-height:600px;border:0;background:#16264e}
#jumperFrame.playing{display:block}
#app{max-width:1100px;margin:8px auto}#app[hidden]{display:none!important}
.bt-autoplay-pending #app{visibility:hidden}
</style></head>
<body><main id="app"></main><iframe id="jumperFrame" title="Word Jumper gameplay" src="./jumper-game.html?release=jumper-core-preview-1"></iframe>
<script type="module">
import { createSharingClient, readStudentSetId } from "./core/sharing.js?release=jumper-multilingual-v2-20261023";
import { createVoiceService } from "./core/voice.js";
const root=document.getElementById("app"),frame=document.getElementById("jumperFrame");
const sharing=createSharingClient({apiBaseUrl:"https://boringteacher-vocabulary-api.mcproductionsdk.workers.dev"});
const voice=createVoiceService();
const dashboard="https://boringteacher.com/dev/word-games/";
const setId=readStudentSetId(location.href);
let jumperReady=false,pendingVocabulary=null;
function returnToDashboard(){
 const url=new URL(dashboard);
 if(setId)url.hash="set="+encodeURIComponent(setId);
 location.assign(url.toString());
}
function deliverJumper(){
 if(!jumperReady||!pendingVocabulary)return;
 frame.contentWindow.postMessage({type:"BT_JUMPER_START",pairs:pendingVocabulary.pairs,language:pendingVocabulary.language},location.origin);
 pendingVocabulary=null;
}
function start(vocabulary){
 document.documentElement.classList.remove("bt-autoplay-pending");
 pendingVocabulary=vocabulary;
 root.hidden=true;frame.classList.add("playing");
 deliverJumper();
 frame.contentWindow?.postMessage({type:"BT_JUMPER_PING"},location.origin);
 frame.focus();
}
function showError(message){
 document.documentElement.classList.remove("bt-autoplay-pending");
 frame.classList.remove("playing");root.hidden=false;
 root.replaceChildren();
 const heading=document.createElement("h2"),detail=document.createElement("p"),back=document.createElement("a");
 heading.textContent="WORD JUMPER · UNABLE TO START";detail.textContent=message;
 back.textContent="RETURN TO WORD GAMES";back.href=dashboard+(setId?"#set="+encodeURIComponent(setId):"");
 root.append(heading,detail,back);
}
window.addEventListener("message",e=>{
 if(e.origin!==location.origin||e.source!==frame.contentWindow)return;
 if(e.data?.type==="BT_JUMPER_READY"){jumperReady=true;deliverJumper();}
 if(e.data?.type==="BT_JUMPER_SPEAK"&&typeof e.data.text==="string"&&e.data.text.length<=250&&["es-ES","de-DE","da-DK","en-US","fr-FR","it-IT"].includes(e.data.language)){void voice.speak(e.data.text,e.data.language);}
 if(e.data?.type==="BT_JUMPER_CANCEL_SPEECH")voice.cancel();
 if(e.data?.type==="BT_JUMPER_MENU"){voice.cancel();returnToDashboard();}
 if(e.data?.type==="BT_JUMPER_START_FAILED")showError("The vocabulary set could not start. Return to Word Games and try again.");
});
frame.addEventListener("load",()=>{jumperReady=false;frame.contentWindow?.postMessage({type:"BT_JUMPER_PING"},location.origin);});
if(!setId){returnToDashboard();}
else{
 root.textContent="LOADING VOCABULARY…";
 sharing.loadSet(setId).then(start).catch(e=>showError(e.message??"Could not load shared vocabulary."));
 frame.contentWindow?.postMessage({type:"BT_JUMPER_PING"},location.origin);
}
</script></body></html>
